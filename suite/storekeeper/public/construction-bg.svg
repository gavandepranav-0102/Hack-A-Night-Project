<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1226"/><stop offset=".55" stop-color="#1d2b4a"/><stop offset="1" stop-color="#e08a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc72c" stop-opacity="0"/><stop offset="1" stop-color="#ffc72c" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="520" width="1600" height="200" fill="url(#glow)"/>
  <!-- distant skyline -->
  <g fill="#16213b" opacity=".85">
    <rect x="40" y="520" width="90" height="260"/><rect x="140" y="470" width="70" height="310"/>
    <rect x="1250" y="500" width="100" height="280"/><rect x="1360" y="450" width="80" height="330"/><rect x="1450" y="540" width="120" height="240"/>
  </g>
  <!-- building frame under construction -->
  <g stroke="#0c1424" stroke-width="10" fill="none">
    <path d="M430 800V300M620 800V300M810 800V300M1000 800V300"/>
    <path d="M410 300H1020M410 420H1020M410 540H1020M410 660H1020"/>
    <path d="M430 420L620 540M620 420L810 540M810 420L1000 540" stroke-width="5"/>
  </g>
  <g fill="#0c1424"><rect x="410" y="290" width="620" height="20"/><rect x="410" y="410" width="620" height="16"/><rect x="410" y="530" width="620" height="16"/><rect x="410" y="650" width="620" height="16"/></g>
  <!-- tower crane -->
  <g stroke="#0c1424" fill="none" stroke-width="8">
    <path d="M1150 800V150"/><path d="M1130 800V150M1170 800V150" stroke-width="4"/>
    <path d="M1130 800l40-60M1170 800l-40-60M1130 700l40-60M1170 700l-40-60M1130 600l40-60M1170 600l-40-60M1130 500l40-60M1170 500l-40-60M1130 400l40-60M1170 400l-40-60M1130 300l40-60M1170 300l-40-60" stroke-width="3"/>
    <path d="M700 150H1380" stroke-width="12"/><path d="M700 170H1380" stroke-width="3"/>
    <path d="M1150 150L760 150M1150 90L1380 150M1150 90L760 150" stroke-width="3"/>
    <path d="M1150 150V90"/>
    <path d="M820 150V330" stroke-width="3"/>
  </g>
  <rect x="800" y="330" width="40" height="30" fill="#ffc72c" opacity=".9"/>
  <rect x="1360" y="150" width="50" height="60" fill="#0c1424"/>
  <!-- ground -->
  <rect y="790" width="1600" height="110" fill="#0a0f1c"/>
  <g fill="#ffc72c" opacity=".85"><circle cx="520" cy="355" r="4"/><circle cx="905" cy="475" r="4"/><circle cx="715" cy="595" r="4"/></g>
  <!-- stacked materials -->
  <g fill="#1a2336"><rect x="90" y="760" width="150" height="40"/><rect x="110" y="725" width="110" height="35"/><rect x="1300" y="765" width="180" height="35"/></g>
</svg>
